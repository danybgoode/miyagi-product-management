# Consolidated fast guards — one job, one checkout, one setup-node, several `--check`/`node --test`
# steps. Formerly 5 separate workflows (build-order-guard, doc-format-guard, scripts-guard,
# infra-guard, yaml-guard); merged 2026-07-16 as part of the local-first CI push (see
# Roadmap/09-platform-infra/github-actions-local-first/). Each of those individually ran in ~10-20
# real seconds but still billed a GitHub Actions minimum of 1 minute per job — up to 5 billed minutes
# for one PR touching several areas. One job with several steps bills ~1 minute total instead.
#
# Triggered on PRs **and on direct pushes to main** (added 2026-08-03). The `push` trigger closes a
# real gap: this repo commits direct-to-main for low-risk doc/tooling work, that path never opens a
# PR, and the local hooks were therefore its ONLY gate — which is exactly why `.githooks/pre-commit`
# had accreted the full test suite plus two ~860-doc corpus walks and a commit took ~2 minutes.
#
# The hooks are now budgeted (pre-commit <2s on staged files; pre-push <30s on cheap whole-repo
# checks) and THIS workflow is the real gate again. The trade is deliberate and worth naming: a
# GitHub minute is asynchronous and parallel — nobody waits for it. A local minute is serial and
# blocking — a human waits for it, every commit. Buying back minutes of human wait for ~1 billed
# minute is a good trade in every direction.
#
# Each step is path-gated via `changed-files`-style `git diff`, so an infra-only change doesn't burn
# time re-running the Roadmap checks — mirrors what the 5 separate workflows' `paths:` triggers used
# to do, just inside one job instead of one trigger each.
name: guards

on:
  pull_request:
    paths:
      - 'Roadmap/**'
      - 'scripts/**'
      - 'infra/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Roadmap/**'
      - 'scripts/**'
      - 'infra/**'
      - '.github/workflows/**'

concurrency:
  # PRs key on the PR number; direct pushes to main key on the ref. Without the fallback every
  # push-to-main run would share one empty group key and cancel its predecessor.
  group: guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    permissions:
      contents: write # build-order self-heal pushes a regen commit back to the PR branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-order/doc-format's extractor derives dates from git history
          # On a PR, check out the PR HEAD (not the synthetic merge commit) so the build-order
          # self-heal can commit + push the regenerated board back to the branch. On a push to
          # main, `head.sha` is empty and this falls through to the default (the pushed commit).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed areas
        id: areas
        run: |
          # PR → diff against the merge base. Push to main → diff against the previous tip
          # (`event.before`), falling back to HEAD~1 for the first push on a new branch, where
          # `before` is the all-zeroes null SHA.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "$base"...HEAD)
          {
            echo "roadmap=$(echo "$changed" | grep -qE '^(Roadmap/|scripts/(build-order|doc-format|roadmap-to-notion)\.mjs)' && echo true || echo false)"
            echo "scripts=$(echo "$changed" | grep -qE '^scripts/' && echo true || echo false)"
            echo "infra=$(echo "$changed" | grep -qE '^infra/' && echo true || echo false)"
            echo "workflows=$(echo "$changed" | grep -qE '^\.github/workflows/' && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: build-order — status board is fresh (self-heals stale boards)
        if: steps.areas.outputs.roadmap == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if node scripts/build-order.mjs --check; then exit 0; fi
          # Self-heal (build-order-ci-self-heal epic): BUILD-ORDER.md is DERIVED from epic
          # frontmatter — a stale board is a forgotten `node scripts/build-order.mjs`, not a
          # judgment call. Regenerate and push the one derived file back to the branch instead
          # of redding the run. GITHUB_TOKEN pushes don't retrigger workflows, so this run's own
          # green is the healed verdict (no recursion possible).
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::BUILD-ORDER.md is stale and this is a fork PR (cannot push a heal commit). Run 'node scripts/build-order.mjs' locally and commit the result."
            exit 1
          fi
          # On a direct push to main there is no head_ref; heal onto main itself. The local
          # pre-push hook normally catches this first — reaching here means it was bypassed or
          # inactive, so healing rather than failing keeps the derived board correct either way.
          if [ -z "$HEAD_REF" ]; then HEAD_REF="${GITHUB_REF_NAME}"; fi
          node scripts/build-order.mjs
          git add Roadmap/00-ideas/BUILD-ORDER.md
          if git diff --cached --quiet; then
            echo "::error::--check failed but the regenerated board is byte-identical to the committed one — generator nondeterminism? Inspect scripts/build-order.mjs."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(build-order): self-heal — regenerate derived board" -- Roadmap/00-ideas/BUILD-ORDER.md
          git push origin HEAD:"$HEAD_REF"
          node scripts/build-order.mjs --check

      - name: doc-format — Roadmap doc canonical shape (enforced paths only)
        if: steps.areas.outputs.roadmap == 'true'
        run: node scripts/doc-format.mjs --check

      - name: scripts/ — CLI/tooling node:test (pure, ~0.6s for 37 files)
        if: steps.areas.outputs.scripts == 'true'
        run: node --test 'scripts/lib/*.test.mjs' 'scripts/*.test.mjs'

      # The integration tier. `*.itest.mjs` files spawn a real `roadmap-to-notion.mjs --extract`,
      # which parses every doc under Roadmap/ (~860 files). They are CI-only by design: they were
      # responsible for ~5 of the ~8 corpus walks that made a local commit take 2 minutes.
      # Run them on demand locally with: node --test 'scripts/*.itest.mjs'
      - name: scripts/ — integration node:test (corpus-walking, CI-only tier)
        if: steps.areas.outputs.roadmap == 'true' || steps.areas.outputs.scripts == 'true'
        run: node --test 'scripts/*.itest.mjs'

      - name: infra/ — deploy-invariants node:test
        if: steps.areas.outputs.infra == 'true'
        run: node --test infra/gcp/test/*.test.js infra/gcp/test/*.test.mjs

      - name: yaml — actionlint on workflow files
        if: steps.areas.outputs.workflows == 'true'
        env:
          ACTIONLINT_VERSION: '1.7.12'
        shell: bash
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color
